networks:
  1panel-network:
    external: true

services:
  sub-store:
    image: xream/sub-store:2.43.1
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:3001"
    environment:
      TZ: Asia/Shanghai
      SUB_STORE_BACKEND_API_HOST: 127.0.0.1
      SUB_STORE_BACKEND_API_PORT: "3000"
      SUB_STORE_FRONTEND_HOST: 0.0.0.0
      SUB_STORE_FRONTEND_PORT: "3001"
      SUB_STORE_FRONTEND_BACKEND_PATH: "/${SUB_STORE_BACKEND_TOKEN:?Please set a random alphanumeric backend token}"
      SUB_STORE_CORS_ALLOWED_ORIGINS: "${SUB_STORE_CORS_ALLOWED_ORIGINS:-https://sub-store.vercel.app,http://substore.stash,https://substore.stash}"
    volumes:
      - ./data:/opt/app/data
    labels:
      createdBy: "Apps"
