additionalProperties:
  formFields:
    - default: immich
      edit: true
      envKey: CONTAINER_NAME
      label:
        zh: 容器名称
        zh-Hant: 容器名稱
        en: Container Name
        ja: コンテナ名
        ko: 컨테이너 이름
        ru: Имя контейнера
        fr: Nom du conteneur
        de: Container-Name
        es: Nombre del contenedor
        pt-BR: Nome do contêiner
      required: true
      rule: paramCommon
      type: text

    - default: 2283
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      label:
        zh: Web 端口
        zh-Hant: Web 連接埠
        en: Web Port
        ja: Web ポート
        ko: Web 포트
        ru: Веб-порт
        fr: Port Web
        de: Web-Port
        es: Puerto web
        pt-BR: Porta Web
      required: true
      rule: paramPort
      type: number

    - default: v3.3.0
      edit: true
      envKey: IMMICH_VERSION
      label:
        zh: 镜像版本
        zh-Hant: 映像版本
        en: Image Tag
        ja: イメージタグ
        ko: 이미지 태그
        ru: Тег образа
        fr: Tag de l'image
        de: Image-Tag
        es: Etiqueta de imagen
        pt-BR: Tag da imagem
      required: true
      type: text

    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      label:
        zh: 时区
        zh-Hant: 時區
        en: Time Zone
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        fr: Fuseau horaire
        de: Zeitzone
        es: Zona horaria
        pt-BR: Fuso horário
      required: true
      type: text

    - default: ImmichDB2026
      edit: true
      envKey: DB_PASSWORD
      label:
        zh: 数据库密码（仅限字母和数字）
        zh-Hant: 資料庫密碼（僅限字母和數字）
        en: Database Password (letters and numbers only)
        ja: データベースパスワード（英数字のみ）
        ko: 데이터베이스 비밀번호(영문 및 숫자만)
        ru: Пароль базы данных (только буквы и цифры)
        fr: Mot de passe de la base (lettres et chiffres uniquement)
        de: Datenbankpasswort (nur Buchstaben und Zahlen)
        es: Contraseña de base de datos (solo letras y números)
        pt-BR: Senha do banco (somente letras e números)
      required: true
      rule: paramCommon
      type: password

    - default: SSD
      edit: true
      envKey: DB_STORAGE_TYPE
      label:
        zh: 数据库存储类型
        zh-Hant: 資料庫儲存類型
        en: Database Storage Type
        ja: データベースストレージ種別
        ko: 데이터베이스 저장소 유형
        ru: Тип хранилища базы данных
        fr: Type de stockage de la base
        de: Datenbank-Speichertyp
        es: Tipo de almacenamiento de la base
        pt-BR: Tipo de armazenamento do banco
      required: true
      type: select
      values:
        - label: SSD
          value: SSD
        - label: HDD
          value: HDD
