networks:
  1panel-network:
    external: true

services:
  cc-switch-web:
    image: ghcr.io/zuoliangyu/cc-switch-web:2.1.0
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    networks:
      - 1panel-network
    ports:
      - "${PANEL_APP_PORT_HTTP}:8890"
    environment:
      HOME: /data
      CC_SWITCH_WEB_HOST: 0.0.0.0
      CC_SWITCH_WEB_PORT: 8890
      CC_SWITCH_WEB_PORT_SCAN_COUNT: 1
      CC_SWITCH_WEB_ACCESS_KEY: ${CC_SWITCH_WEB_ACCESS_KEY:-}
    volumes:
      - ./data:/data
    labels:
      createdBy: "Apps"
