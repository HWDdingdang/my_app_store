services:
  open-box:
    image: open-box:0.1.427
    pull_policy: never
    container_name: ${CONTAINER_NAME}
    restart: unless-stopped
    stop_grace_period: 30s
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.send_redirects: "0"
      net.ipv4.conf.default.send_redirects: "0"
    environment:
      TZ: Asia/Shanghai
      OPENBOX_PANEL_PORT: "${PANEL_APP_PORT_HTTP}"
      OPENBOX_MASQUERADE: "1"
    volumes:
      - ./etc:/opt/open-box/etc
      - ./data:/opt/open-box/data
    networks:
      lan:
        ipv4_address: ${OPENBOX_LAN_IP:?Set an unused LAN IPv4 address outside the DHCP pool}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      createdBy: "Apps"

networks:
  lan:
    driver: ${OPENBOX_NETWORK_DRIVER}
    driver_opts:
      parent: ${OPENBOX_LAN_INTERFACE}
    ipam:
      config:
        - subnet: ${OPENBOX_LAN_SUBNET}
          gateway: ${OPENBOX_LAN_GATEWAY}
